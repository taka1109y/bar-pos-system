# 分析サイト（analytics-web）の nginx 設定
# - 静的 SPA を配信し、/api/ を analytics-server:3101 へプロキシする
# - /api/legacy/（既存 server/routes の reports・logs をそのまま再利用する経路）は GET/HEAD のみ許可
# - 127.0.0.1:8080 にのみ公開されるローカル専用サイト（docker-compose.analytics.yml）
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # 末尾スラッシュ補完の 301（例: /api/legacy → /api/legacy/）を相対 Location にする。
    # 既定（absolute）だと Location が http://127.0.0.1/api/legacy/ となり公開ポート 8080 が落ちて
    # POS 本体（:80）へ飛んでしまうため
    absolute_redirect off;

    client_max_body_size 10m;

    # セキュリティヘッダー
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 隠しファイル・ディレクトリへのアクセス禁止
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # 静的アセット（ハッシュ付きファイル名）は長期キャッシュ
    location ~* \.(js|css|woff|woff2|ttf|eot|ico|svg|png|jpg|jpeg|gif|webp)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 既存 API の読み取り専用再利用経路: GET/HEAD 以外は 403
    # （^~ で正規表現 location より優先し、拡張子付きパスでも静的配信に落ちないようにする）
    location ^~ /api/legacy/ {
        limit_except GET HEAD { deny all; }
        proxy_pass         http://analytics-server:3101;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
        # location 内で add_header を使うと server ブロックの add_header は継承されないため再掲
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-store";
    }

    # 分析 API（/api/v1/...）
    location ^~ /api/ {
        proxy_pass         http://analytics-server:3101;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-store";
    }

    # SPA: index.html はキャッシュしない（デプロイ後に即反映）
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # SPA: React Router のパスを全て index.html にフォールバック
    location / {
        try_files $uri $uri/ /index.html;
    }
}
